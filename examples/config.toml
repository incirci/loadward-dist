# Minimal Loadward configuration for GitHub Actions.
# Replace the GitHub App placeholders and installation ID.
#
# The GitHub App installation is the repository authorization boundary.
# Loadward discovers every repository in that installation automatically.
# Every configured route is available to every installed repository.

[github]
app_client_id = "YOUR_GITHUB_APP_CLIENT_ID"
app_installation_id = 12345678
private_key_file = "~/.config/loadward/github-app.pem"
max_runners = 1

[providers.local-docker-isolated]
type = "docker"
image = "ghcr.io/actions/actions-runner:latest"

[profiles.isolated-local]
provider = "local-docker-isolated"
capacity = 1
priority = 10

# GitHub workflows select routes, never internal profile/provider names.
[github.routes.local-isolated]
isolation = "container"
workspace = "none"
location = "local"
