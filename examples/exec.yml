name: Exec
run-name: Exec · ${{ inputs.route }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      route:
        description: Loadward execution route
        required: true
        type: string
      request_id:
        description: Unique request identifier
        required: true
        type: string
      task_b64:
        description: Base64-encoded bash task
        required: true
        type: string

permissions: {}

jobs:
  run:
    runs-on: ${{ inputs.route }}
    timeout-minutes: 60

    steps:
      - name: Run task
        shell: bash
        env:
          TASK_B64: ${{ inputs.task_b64 }}
          LOADWARD_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          task="$(mktemp "$RUNNER_TEMP/loadward-task.XXXXXX")"
          trap 'rm -f "$task"' EXIT
          umask 077
          printf '%s' "$TASK_B64" | base64 --decode > "$task"
          bash "$task"
